name: MotionCuesPhone
options:
  bundleIdPrefix: com.motioncues
  deploymentTarget:
    iOS: "17.0"
targets:
  MotionCuesPhone:
    type: application
    platform: iOS
    sources:
      - path: MotionCuesPhone
    info:
      path: MotionCuesPhone/Info.plist
      properties:
        CFBundleDisplayName: MotionCuesPhone
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.motioncues.MotionCuesPhone
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
